task_group_list: # ai生成任务组列表，按workflow_type分组，包含有依赖任务的组靠后放
  - task_group_ordinal: 1 # 任务组序号，递增，小的先执行，
    workflow_code: z_image_fp16_step4
    tasks:
      - ordinal: 1 # 任务序号，全局唯一
        scene_id: scene1 # 所属画面单元的ID
        payload: '{"prompt":"这是文生图提示词1","width":1920,"height":1080}' # 传给comfyui-scheduler工具的流水线运行参数，JSON格式，用$taskn占位依赖任务的产物
        dependent_task: 0 # 依赖任务的序号，0表示无依赖,如图生视频会依赖文生图产物
      - ordinal: 2 # 任务序号
        scene_id: scene2 # 所属画面单元的ID
        payload: '{"prompt":"这是文生图提示词2","width":1920,"height":1080}'
        dependent_task: 0
  - task_group_ordinal: 2
    workflow_code: ltx2.3_i2v_int8
    tasks:
      - ordinal: 3
        scene_id: scene1
        dependent_task: 1
        payload: '{"prompt":"这是图生视频提示词1","width":1920,"height":1080,"total_frame":120,"image_file":"$task1"}'
      - ordinal: 4
        scene_id: scene2
        dependent_task: 2
        payload: '{"prompt":"这是图生视频提示词2","width":1920,"height":1080,"total_frame":120,"image_file":"$task2"}'
  - task_group_ordinal: 3
    workflow_code: ltx2.3_t2v_int8
    tasks:
      - ordinal: 5
        scene_id: scene1
        dependent_task: 0
        payload: '{"prompt":"这是文生视频提示词1","width":1920,"total_frame":120,"height":1080}'
      - ordinal: 6
        scene_id: scene2
        dependent_task: 0
        payload: '{"prompt":"这是文生视频提示词2","width":1920,"total_frame":120,"height":1080}'
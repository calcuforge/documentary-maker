resolution: 1080P # 分辨率1080P/4k
orientation: horizontal # horizontal (16:9) | vertical (9:16).
fps: 24.0
theme:
  # These override the matching fields in themes/<category>.yaml.
  # Explicit fields here win; everything else falls back to the theme preset.
  primary_color: "#4f6ef7"
  background_color: "#ffffff"
  text_color: "#1a1a1a"
  accent_color: "#FF6B6B"
  transition_type: fade   # fade | slide | wipe | none
  transition_duration: 12.0
subtitle:
  font_size: 20,
  primary_color: "&H00333333",
  outline_color: "&H00FFFFFF",
  outline: 2,
  alignment: 2,
  marginV: 6
  list:
    - text: xxx
      start_frame: 1
      end_frame: 120
    - text: xxx
      start_frame: 121
      end_frame: 320
stories:
  - story_name: xxx #章节标题
    story_id: story1
    section_list:
        - total_frame: 120
          remotion_component: xxx # 如QuoteBlock
          remotion_data: {"xxx":"xxx"} # 展示内容的结构化数据（用于填充到组件），json格式
          audio: /path/to/1.wav # 旁白音频
          scene_id: scene1 # 对应画面单元ID
# project_prefs.yaml — project-level defaults for explainer-video-maker.
# Copied to projects/<name>/project_prefs.yaml on first `project create`.
# Per-video overrides go in videos/<video-name>/video_info.yaml.

project:
  # Logical id, lowercase-hyphen. Should match the projects/<name>/ folder name.
  name: my-project
  # Category maps to themes/<category>.yaml. Built-in:
  #   animal-science | life-science | history | aviation-disaster | crime |
  #   natural-disaster | tech-news | daily-news | current-affairs | knowledge-sharing
  category: knowledge-sharing
  # horizontal (16:9) | vertical (9:16).
  orientation: horizontal
  # auto — pipeline runs end-to-end. manual — each AI product waits for user confirmation.
  creation_mode: auto
  # Narration language: zh-CN | en-US.
  language: zh-CN

video:
  # 1080p (1920x1080 horizontal, 1080x1920 vertical) | 4k (3840x2160 / 2160x3840).
  # Vertical is limited to 1080p in v1.
  resolution: 1080p
  fps: 30
  # Composition id is resolved automatically:
  #   horizontal + 1080p → MainVideo
  #   horizontal + 4k    → MainVideo4K
  #   vertical           → MainVideoVertical

ai:
  # speed:   image at 1280x720, video at 854x480, then upscale to target.
  # quality: image at 1920x1080 (skip image upscale if target 1080p), video at 1280x720, upscale to target.
  quality_tier: speed
  # null = random per run. Pin a seed for reproducibility.
  seed: null
  # Global negative prompt appended to every image/video workflow.
  negative_prompt: "lowres, watermark, text, deformed, blurry, extra fingers"

workflows:
  # ComfyUI workflow ids (must be imported into comfyui-scheduler's database).
  # Defaults match comfyui-scheduler/data/default_workflows/meta/.
  voice_design: ominivoice_voice_design   # or qwen3_tts_voice_design
  text_to_image: z_image_fp16
  image_to_image: qwen_image_edit_2511_int8_step4
  text_to_video: ltx2.3_t2v_int8
  image_to_video: ltx2.3_i2v_int8
  first_last_frame_to_video: ltx2.3_flf2v_int8
  multi_scene_i2v: wan2.2_svi2pro_vbvr_int8
  image_upscale: nvidia_rtx_image_upscale
  video_upscale: nvidia_rtx_video_upscale
  tts: index_tts_2

tts:
  # ── Backend selection ──────────────────────────────────────────────────
  #   comfyui_indextts — ComfyUI index_tts_2 workflow (default).
  #   http_server      — HTTP multipart TTS server (see tts.http below).
  #
  # Both `tts synth` and `tts run` auto-read this field — no --backend flag
  # needed in commands. Set once, all TTS calls route automatically.
  backend: comfyui_indextts

  # ── Reference voice (required for both backends) ───────────────────────
  # Generated once per project by Step 0 (voice design). All videos in the
  # project share the same voice. Auto-resolved to:
  #   projects/{name}/voice_reference.wav
  # if left as null and the file exists.
  voice_file: null

  # ── HTTP TTS server config (only used when backend: http_server) ───────
  # Protocol: POST multipart/form-data
  #   Fields:  input      — narration text (form field)
  #            speed      — speech speed multiplier (form field, float as string)
  #            voice_file — reference WAV (file upload, audio/wav)
  #   Response: raw audio bytes (HTTP 200 → body is the WAV data)
  #
  # The URL is resolved via os.path.expandvars(). ${BACKEND_PROXY_ENDPOINT}
  # must be set in the shell environment before running any TTS command.
  http:
    url: ${BACKEND_PROXY_ENDPOINT}/v1/audio/speech
    speed: 1.0              # 0.25–4.0, passed as form field

bgm:
  # 0 to 1.0. Default 0.12 = ~-18 dB, sits clearly below boosted narration.
  volume: 0.12
  # Absolute path to a looping BGM mp3, or null for no BGM.
  track: null
  loop: true

theme:
  # These override the matching fields in themes/<category>.yaml.
  # Explicit fields here win; everything else falls back to the theme preset.
  primary_color: "#4f6ef7"
  background_color: "#ffffff"
  text_color: "#1a1a1a"
  accent_color: "#FF6B6B"
  transition_type: fade   # fade | slide | wipe | none
  transition_duration: 18 # frames @ fps
  # Hint list — composition generator prefers these components when picking a layout.
  preferred_components:
    - Timeline
    - FlowChart
    - DataBar
    - MediaSection
    - DiagramReveal

content:
  tone: educational        # educational | casual | serious | narrative | analytical | news-brief
  section_count: 7         # target SCENE count; structure design may deviate ±1
  # Planning hint for total runtime (scene structure ultimately follows narration).
  target_duration_seconds: 360

research:
  # Override theme-level research_providers. Set to null to use theme defaults.
  # Set to a provider list to fully override. See references/workflow-script.md#step-2-research-topic.
  providers: null           # null = use theme's research_providers

paths:
  # remotion_template: relative to the explainer-video-maker repo root, or an
  # absolute path. The template sits next to the repo root by default.
  remotion_template: ../remotion-video-template
  comfyui_scheduler: ../../comfyui-scheduler

triggers:
  # Keyword → category map. Used by the skill description for trigger routing.
  keywords:
    animal-science: ["动物科普", "动物世界", "野生动物", "海洋生物", "动物纪录片", "animal documentary"]
    life-science: ["生活科普", "为什么", "怎么回事", "冷知识", "日常科普", "how it works", "生活中的科学"]
    history: ["历史纪录片", "历史事件", "古代", "朝代", "history documentary"]
    aviation-disaster: ["空难", "航空事故", "空难纪录片", "飞机失事", "aviation disaster"]
    crime: ["案件纪实", "真实犯罪", "悬案", "凶案", "crime documentary", "案件纪录片"]
    natural-disaster: ["自然灾害", "地震", "海啸", "台风", "洪水", "natural disaster"]
    tech-news: ["科技新闻", "新技术", "AI新闻", "科技前沿", "tech news", "科技资讯"]
    daily-news: ["今日新闻", "资讯日报", "每日资讯", "新闻简报", "daily news", "新闻速览"]
    current-affairs: ["时事新闻", "时事评论", "热点事件", "社会热点", "current affairs"]
    knowledge-sharing: ["知识分享", "科普视频", "你知道吗", "涨知识", "冷知识", "knowledge", "explainer"]

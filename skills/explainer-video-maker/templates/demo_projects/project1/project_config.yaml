project:
  name: my-project
  project_root_path: /path/to/projects/my-project # project root path
  creation_mode: auto # auto — pipeline runs end-to-end. manual — each AI product waits for user confirmation.
  language: zh-CN  # Narration language: zh-CN | en-US.
  video_style: xxx
  target_audience: xxx
video:
  orientation: horizontal # horizontal (16:9) | vertical (9:16).
  resolution: 1080p # 1080p (1920x1080 horizontal, 1080x1920 vertical) | 4k (3840x2160 / 2160x3840).
  fps: 24
aigc:
  # Origin (pre-upscale) generation dimensions. AIGC assets are generated at
  # these sizes, then upscaled to the target video resolution if needed.
  origin_image_width: 1280
  origin_image_height: 720
  origin_video_width: 1280
  origin_video_height: 720
  seed: 0 # 全局随机种子
tts:
  # ── Backend selection ──────────────────────────────────────────────────
  #   comfyui_indextts — ComfyUI index_tts_2 workflow (default).
  #   http_server      — HTTP multipart TTS server (see tts.http below).
  #
  # Both `tts synth` and `tts run` auto-read this field — no --backend flag
  # needed in commands. Set once, all TTS calls route automatically.
  backend: comfyui_indextts
  speed: 1.0
    # ── Reference voice ─────────────────────────────────────────────────────
    # voice_file: can be empty at Step 1. If empty when running TTS (Step 5),
    #   the voice design workflow runs automatically using voice_instruct,
    #   generates projects/{name}/voice_file.wav, and updates this field.
    # voice_instruct: REQUIRED. Describes the target voice characteristics.
    #   zh-CN example: "男，中年，中音调"  en-US example: "male, middle-aged, moderate pitch"
    #   See comfyui-scheduler/doc/workflow.md for valid attributes.
  voice_file: ""
  voice_instruct: "男，中年，中音调"
    # ── HTTP TTS server config (only used when backend: http_server) ───────
    # Protocol: POST multipart/form-data
    #   Fields:  input      — narration text (form field)
    #            speed      — speech speed multiplier (form field, float as string)
    #            voice_file — reference WAV (file upload, audio/wav)
    #   Response: raw audio bytes (HTTP 200 → body is the WAV data)
    #
    # The URL is resolved via os.path.expandvars(). ${BACKEND_PROXY_ENDPOINT}
    # must be set in the shell environment before running any TTS command.
  http:
      url: ${BACKEND_PROXY_ENDPOINT}/v1/audio/speech
      speed: 1.0              # 0.25–4.0, passed as form field
      headers:                # custom HTTP headers (optional)
        Host-User-ID: ""
        Host-User-Token: ""
theme:
  # These override the matching fields in themes/<category>.yaml.
  # Explicit fields here win; everything else falls back to the theme preset.
  primary_color: "#4f6ef7"
  background_color: "#ffffff"
  text_color: "#1a1a1a"
  accent_color: "#FF6B6B"
  transition_type: fade   # fade | slide | wipe | none
  transition_duration: 12 # frames @ fps
content:
  duration: medium # 仅控制章节数：short=2-3 章 / medium=5-7 章 / long=8-12 章
  min_story_chars: 500 # 每个章节讲稿（stories/{story_id}/script.md）的最少字数，verify_story_scripts.py 校验
render:
  concurrency: 1 # Remotion render concurrency (number of parallel browser tabs). Increase to speed up rendering on multi-core machines.
dependence_paths:
  # remotion_template: relative to the explainer-video-maker repo root, or an
  # absolute path. The template sits next to the repo root by default.
  remotion_template: ../remotion-video-template
  comfyui_scheduler: ../../comfyui-scheduler
subtitle:
  # font_size: adjust based on resolution and orientation. Do NOT go too small.
  #   1080p horizontal → 26-32    1080p vertical → 36-44
  #   4K horizontal   → 47-57    4K vertical   → 62-73
  font_size: 32
  primary_color: "&H00333333"
  outline_color: "&H00FFFFFF"
  outline: 2
  alignment: 2
  marginV: 6
rss_source_list:
  - url: xxx
    description: xxx
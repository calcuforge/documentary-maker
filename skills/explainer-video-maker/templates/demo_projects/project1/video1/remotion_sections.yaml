resolution: 1080P # 分辨率1080P/4k
orientation: horizontal # horizontal (16:9) | vertical (9:16).
fps: 24.0
theme:
  # These override the matching fields in themes/<category>.yaml.
  # Explicit fields here win; everything else falls back to the theme preset.
  primary_color: "#4f6ef7"
  background_color: "#ffffff"
  text_color: "#1a1a1a"
  accent_color: "#FF6B6B"
  transition_type: fade   # fade | slide | wipe | none
  transition_duration: 12.0
subtitle:
  font_size: 20
  primary_color: "&H00333333"
  outline_color: "&H00FFFFFF"
  outline: 2
  alignment: 2
  marginV: 6
  list: # 与scene_list一一对应：每个画面（旁白）一条字幕
    - text: "1956年，人工智能这一概念首次被提出，科学家开始探索让机器拥有类似人类的思考能力。"
      start_frame: 1
      end_frame: 60
    - text: "同年召开的达特茅斯会议，正式确立了人工智能作为一门独立学科的地位。"
      start_frame: 61
      end_frame: 100
stories: # 对应video_struct.yaml中的stories
  - story_name: 人工智能的崛起 #章节标题
    story_id: story1
    section_list: # 每个section对应一个画面及其旁白（1画面对应1旁白）
        - audio: stories/story1/narration1/speech.wav # 该画面（旁白）的音频
          scene_list: # 对应video_struct.yaml中的scene_list（此处单画面）
            - remotion_component: AssetVideo # 如QuoteBlock
              remotion_data: '{"src":"stories/story1/narration1/scenes/scene1.mp4","role":"background"}' # 展示内容的结构化数据（用于填充到组件），json格式
              total_frame: 60
              scene_id: scene1 # 对应画面单元ID
        - audio: stories/story1/narration2/speech.wav # 该画面（旁白）的音频
          scene_list:
            - remotion_component: StatCounter
              remotion_data: '{"heading":"AI Milestone","items":[{"value":1956,"suffix":"","label":"AI concept proposed","icon":"lightbulb"}]}'
              scene_id: scene2 # 对应画面单元ID
              total_frame: 40

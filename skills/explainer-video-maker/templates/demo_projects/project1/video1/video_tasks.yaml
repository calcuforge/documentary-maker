task_group_list: # ai生成任务组列表，按workflow_type分组，包含有依赖任务的组靠后放
  - task_group_ordinal: 1 # 任务组序号，递增，小的先执行
    workflow_code: z_image_fp16 # 文生图
    tasks:
      - ordinal: 1 # 任务序号，全局唯一
        scene_id: scene1 # 所属画面单元的ID
        payload: '{"prompt":"1956年达特茅斯学院研讨会现场，学者们围坐讨论，复古黑白影像风格","width":1280,"height":720}' # 传给comfyui-scheduler的运行参数，JSON格式，用$taskn占位依赖任务产物
        dependent_task: 0 # 依赖任务的序号，0表示无依赖
      - ordinal: 2
        scene_id: scene3a
        payload: '{"prompt":"1960年代充满信心的计算机实验室，科学家在大型机前工作，明亮乐观的色调","width":1280,"height":720}'
        dependent_task: 0
      - ordinal: 11
        scene_id: scene3b
        payload: '{"prompt":"特写：科学家在大型机前记录数据，复古色调，明亮乐观","width":1280,"height":720}'
        dependent_task: 0
      - ordinal: 3
        scene_id: scene5
        payload: '{"prompt":"1970年代冷清的实验室，停用的大型计算机，灰暗压抑的色调","width":1280,"height":720}'
        dependent_task: 0
      - ordinal: 4
        scene_id: scene8
        payload: '{"prompt":"2012年深度学习神经网络示意图，发光的节点与连接线，科技感蓝色调","width":1280,"height":720}'
        dependent_task: 0
      - ordinal: 5
        scene_id: scene10
        payload: '{"prompt":"2022年生成式AI创作画面，屏幕上自动生成文字与图像，未来感数字空间","width":1280,"height":720}'
        dependent_task: 0
      - ordinal: 6
        scene_id: scene13
        payload: '{"prompt":"人工智能融入现代生活的城市夜景，万家灯火与数据流交织，温暖而宏大","width":1280,"height":720}'
        dependent_task: 0
  - task_group_ordinal: 2
    workflow_code: ltx2.3_i2v_int8 # 图生视频，依赖对应文生图任务产物
    tasks:
      - ordinal: 7
        scene_id: scene1
        dependent_task: 1
        payload: '{"prompt":"研讨会现场学者们交流讨论，镜头缓慢推进","width":960,"height":540,"total_frame":120,"image_file":"$task1"}'
      - ordinal: 8
        scene_id: scene5
        dependent_task: 3
        payload: '{"prompt":"冷清实验室灯光闪烁，镜头缓慢横移","width":960,"height":540,"total_frame":120,"image_file":"$task3"}'
      - ordinal: 9
        scene_id: scene10
        dependent_task: 5
        payload: '{"prompt":"屏幕上文字与图像不断生成流动","width":960,"height":540,"total_frame":120,"image_file":"$task5"}'
      - ordinal: 10
        scene_id: scene13
        dependent_task: 6
        payload: '{"prompt":"城市夜景数据流交织，镜头缓缓上升","width":960,"height":540,"total_frame":120,"image_file":"$task6"}'

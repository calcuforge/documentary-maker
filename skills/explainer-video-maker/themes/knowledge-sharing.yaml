# themes/knowledge-sharing.yaml
# Clean, approachable tone for general knowledge-sharing and explainer videos.

theme:
  primary_color: "#6c5ce7"       # deep purple
  background_color: "#f8f7ff"     # lavender white
  text_color: "#1a1a2e"
  accent_color: "#fd7e14"         # warm amber
  transition_type: fade
  transition_duration: 18

content:
  tone: educational

voice_design:
  prompt: "亲切自然的知识分享旁白，语速适中，声音清晰温暖，像一位博学的朋友在分享有趣的知识，既不沉闷也不过于轻浮，具有让人专注的吸引力"
  speed: 1.0
  workflow: ominivoice_voice_design

component_suggestions:
  hero: FullBleedLayout
  overview: IconCard
  concept: SplitLayout
  process: FlowChart
  examples: FeatureGrid
  data: DataBar
  comparison: ComparisonCard
  quote: QuoteBlock
  summary: StatHighlight

narrative_arc:
  - hook
  - context
  - explanation
  - deep_dive
  - examples
  - takeaway
  - conclusion

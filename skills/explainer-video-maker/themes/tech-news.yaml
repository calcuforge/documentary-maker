theme:
  primary_color: '#5dade2'
  background_color: '#0b1219'
  text_color: '#e1e8f0'
  accent_color: '#00d4aa'
  transition_type: wipe
  transition_duration: 14
content:
  tone: analytical
voice_design:
  voice_instruct: 男，青年，中音调
  content: 今天凌晨，OpenAI发布了最新的多模态模型，引发了AI行业的热烈讨论。
  speed: 1.1
  workflow: ominivoice_voice_design
component_suggestions:
  hero: FullBleedLayout
  overview: MetricsRow
  announcement: SplitLayout
  feature: FeatureGrid
  timeline: Timeline
  architecture: DiagramReveal
  comparison: ComparisonCard
  data: DataBar
  summary: StatHighlight
narrative_arc:
- hook
- announcement
- technology
- impact
- comparison
- outlook
- conclusion
research_providers:
- provider: rss
  enabled: true
  description: 科技新闻RSS源
  feeds:
  - https://hnrss.org/frontpage
  - https://news.google.com/rss/search?q=technology+AI&hl=zh-CN
  - https://feeds.feedburner.com/TheHackersNews
  max_entries: 15
- provider: agent_search
  enabled: true
  description: 搜索科技新闻背景
  queries:
  - '{topic} 最新动态'
  - '{topic} 技术原理'
  - '{topic} 行业影响'
  - '{topic} 对比分析'
- provider: web_fetch
  enabled: false
  urls: []
- provider: custom_script
  enabled: true
  description: 科技新闻聚合脚本
  script_hint: use requests+feedparser to fetch RSS feeds, filter entries by keyword
    relevance, extract title/summary/link/pubDate, sort by date desc

# themes/tech-news.yaml
# Dark tech-blue tone for technology news and innovation videos.

theme:
  primary_color: "#5dade2"       # electric blue
  background_color: "#0b1219"     # deep tech black
  text_color: "#e1e8f0"
  accent_color: "#00d4aa"         # neon teal
  transition_type: wipe
  transition_duration: 14

content:
  tone: analytical

voice_design:
  prompt: "干练专业的科技新闻旁白，语速中等偏快，声音干脆利落，适合报道技术进展和产品发布，具有现代感和科技感"
  speed: 1.1
  workflow: ominivoice_voice_design

component_suggestions:
  hero: FullBleedLayout
  overview: MetricsRow
  announcement: SplitLayout
  feature: FeatureGrid
  timeline: Timeline
  architecture: DiagramReveal
  comparison: ComparisonCard
  data: DataBar
  summary: StatHighlight

narrative_arc:
  - hook
  - announcement
  - technology
  - impact
  - comparison
  - outlook
  - conclusion

theme:
  primary_color: '#2d8c4a'
  background_color: '#0d1f12'
  text_color: '#e8f0e2'
  accent_color: '#e8a840'
  transition_type: fade
  transition_duration: 18
content:
  tone: educational
voice_design:
  voice_instruct: 女，青年，中音调
  content: 在太平洋深处的珊瑚礁中，生活着自然界最聪明的无脊椎动物之一——章鱼。
  speed: 1.0
  workflow: ominivoice_voice_design
component_suggestions:
  hero: FullBleedLayout
  overview: IconCard
  habitat: MediaSection
  behavior: FlowChart
  species: ComparisonCard
  migration: Timeline
  statistics: DataBar
  quote: QuoteBlock
  summary: StatHighlight
narrative_arc:
- hook
- species_intro
- habitat
- behavior
- survival
- conservation
- conclusion
research_providers:
- provider: agent_search
  enabled: true
  description: 搜索动物学知识
  queries:
  - '{topic} 动物行为'
  - '{topic} 栖息地'
  - '{topic} Wikipedia'
  - '{topic} 科学研究'
  - '{topic} 纪录片'
- provider: web_fetch
  enabled: true
  description: Wikipedia、National Geographic
  urls: []
- provider: rss
  enabled: false
  feeds: []
- provider: custom_script
  enabled: false

# themes/daily-news.yaml
# Clean, newspaper-style tone for daily news briefing videos.

theme:
  primary_color: "#2c3e50"       # newspaper navy
  background_color: "#fafbfc"     # newsprint white
  text_color: "#1a1a2e"
  accent_color: "#c0392b"         # headline red
  transition_type: slide
  transition_duration: 12

content:
  tone: news-brief

voice_design:
  prompt: "清晰稳重的新闻播音员，语速中等偏快，声音干净有力，适合播报每日新闻简报和资讯汇总，像新闻主播一样客观专业"
  speed: 1.15
  workflow: ominivoice_voice_design

component_suggestions:
  hero: FullBleedLayout
  headlines: FeatureGrid
  story: SplitLayout
  data: DataBar
  metrics: MetricsRow
  timeline: Timeline
  quote: QuoteBlock
  summary: StatHighlight

narrative_arc:
  - intro
  - headline_1
  - headline_2
  - headline_3
  - deeper_story
  - wrap_up
  - sign_off

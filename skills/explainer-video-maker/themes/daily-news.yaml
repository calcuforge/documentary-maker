theme:
  primary_color: '#2c3e50'
  background_color: '#fafbfc'
  text_color: '#1a1a2e'
  accent_color: '#c0392b'
  transition_type: slide
  transition_duration: 12
content:
  tone: news-brief
voice_design:
  voice_instruct: 男，中年，中音调
  content: 各位好，今天是7月27日，以下是今天的要闻速览。
  speed: 1.15
  workflow: ominivoice_voice_design
component_suggestions:
  hero: FullBleedLayout
  headlines: FeatureGrid
  story: SplitLayout
  data: DataBar
  metrics: MetricsRow
  timeline: Timeline
  quote: QuoteBlock
  summary: StatHighlight
narrative_arc:
- intro
- headline_1
- headline_2
- headline_3
- deeper_story
- wrap_up
- sign_off
research_providers:
- provider: rss
  enabled: true
  description: 新闻RSS源
  feeds:
  - https://news.google.com/rss?hl=zh-CN
  - https://news.google.com/rss/search?q=要闻&hl=zh-CN
  max_entries: 20
- provider: agent_search
  enabled: true
  description: 搜索新闻背景和细节
  queries:
  - '{topic} 详情'
  - '{topic} 最新进展'
  - '{topic} 各方反应'
- provider: web_fetch
  enabled: false
  urls: []
- provider: custom_script
  enabled: true
  description: 新闻聚合脚本
  script_hint: use requests+feedparser to fetch multiple RSS feeds, deduplicate and
    merge, sort by pubDate, extract top 20 headlines
visual_composition:
  aigc: low
  stock: high
  data_charts: medium
  text_components: high
  note: 新闻简报以文本组件为主展示头条标题和提要，搜索新闻配图作为背景素材，AI合成几乎不用

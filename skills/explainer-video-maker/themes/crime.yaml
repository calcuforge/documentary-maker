# themes/crime.yaml
# Dark, suspenseful tone for true-crime documentaries.

theme:
  primary_color: "#a8b5c0"       # cold steel
  background_color: "#0c0f14"     # noir black
  text_color: "#dde3e8"
  accent_color: "#c9303c"         # blood red
  transition_type: fade
  transition_duration: 16

content:
  tone: analytical

voice_design:
  prompt: "冷静理性的男性纪录片旁白，语速中等偏慢，声线平稳不带感情，适合讲述案件调查和证据分析，具有侦探式的客观感"
  speed: 0.95
  workflow: ominivoice_voice_design

component_suggestions:
  hero: FullBleedLayout
  overview: IconCard
  timeline: Timeline
  investigation: FlowChart
  evidence_chain: FlowChart
  motive: SplitLayout
  impact: DataBar
  quote: QuoteBlock
  verdict: StatHighlight
  summary: StatHighlight

narrative_arc:
  - hook
  - crime_scene
  - background
  - investigation
  - trial
  - aftermath
  - conclusion

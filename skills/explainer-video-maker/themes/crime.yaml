theme:
  primary_color: '#a8b5c0'
  background_color: '#0c0f14'
  text_color: '#dde3e8'
  accent_color: '#c9303c'
  transition_type: fade
  transition_duration: 16
content:
  tone: analytical
voice_design:
  voice_instruct: 男，青年，中音调
  content: 2013年7月1日，一名年轻女子在回家途中失踪，这起案件揭开了长达三年的调查序幕。
  speed: 0.95
  workflow: ominivoice_voice_design
component_suggestions:
  hero: FullBleedLayout
  overview: IconCard
  timeline: Timeline
  investigation: FlowChart
  evidence_chain: FlowChart
  motive: SplitLayout
  impact: DataBar
  quote: QuoteBlock
  verdict: StatHighlight
  summary: StatHighlight
narrative_arc:
- hook
- crime_scene
- background
- investigation
- trial
- aftermath
- conclusion
research_providers:
- provider: agent_search
  enabled: true
  description: 搜索案件资料
  queries:
  - '{topic} 案件详情'
  - '{topic} 调查过程'
  - '{topic} 判决结果'
  - '{topic} 新闻报道'
  - '{topic} Wikipedia'
- provider: web_fetch
  enabled: true
  description: Wikipedia、新闻报道基础事实
  urls: []
- provider: rss
  enabled: false
  feeds: []
- provider: custom_script
  enabled: false

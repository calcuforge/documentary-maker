# themes/aviation-disaster.yaml
# Partial override merged on top of project_prefs.theme / content.
# Explicit fields in project_prefs.theme win over these.

theme:
  primary_color: "#b8c5d6"       # cool steel
  background_color: "#0e1419"    # deep cockpit black
  text_color: "#e6e8eb"
  accent_color: "#c9303c"        # emergency red
  transition_type: fade
  transition_duration: 18

content:
  tone: serious

# Voice design — narrator voice persona for this theme.
# Prompt is sent to the voice_design ComfyUI workflow (ominivoice / qwen3_tts).
# The output voice_reference.wav is stored at the project level and shared
# across all videos in that project.
voice_design:
  prompt: "沉稳严肃的男性纪录片旁白，语速适中偏慢，声音低沉有力，适合讲述航空事故调查过程，不带情绪波动但具有权威感"
  speed: 0.9
  workflow: ominivoice_voice_design   # or qwen3_tts_voice_design

# Hint: which component to pick for each section name pattern.
# Composition generator keys off the section `name` to choose a layout
# when narration_script.yaml doesn't override it.
component_suggestions:
  hero: FullBleedLayout
  overview: IconCard
  timeline: Timeline
  event_sequence: Timeline
  cause_chain: FlowChart
  cause_analysis: FlowChart
  impact: DataBar
  aftermath: Timeline
  quote: QuoteBlock
  summary: StatHighlight

# Narrative arc hint for chapter design (Step 3).
# Suggested section order — the chapter designer follows this unless the topic
# clearly demands otherwise.
narrative_arc:
  - hook
  - background
  - event_timeline
  - cause_analysis
  - impact
  - aftermath
  - conclusion

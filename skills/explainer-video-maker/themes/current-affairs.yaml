theme:
  primary_color: '#1a1a2e'
  background_color: '#f2f2f5'
  text_color: '#1a1a2e'
  accent_color: '#c0392b'
  transition_type: wipe
  transition_duration: 14
content:
  tone: serious
voice_design:
  voice_instruct: 男，中年，低音调
  content: 近期，一系列社会热点事件引发了公众的广泛关注和讨论。
  speed: 0.95
  workflow: ominivoice_voice_design
component_suggestions:
  hero: FullBleedLayout
  overview: IconCard
  background: Timeline
  analysis: FlowChart
  perspectives: ComparisonCard
  impact: DataBar
  quote: QuoteBlock
  summary: StatHighlight
narrative_arc:
- hook
- context
- key_development
- analysis
- impact
- outlook
- conclusion
research_providers:
- provider: rss
  enabled: true
  description: 时事新闻RSS源
  feeds:
  - https://news.google.com/rss?hl=zh-CN
  - https://news.google.com/rss/search?q=时事热点&hl=zh-CN
  max_entries: 15
- provider: agent_search
  enabled: true
  description: 搜索时事背景和分析
  queries:
  - '{topic} 事件经过'
  - '{topic} 各方观点'
  - '{topic} 影响分析'
  - '{topic} 专家评论'
- provider: web_fetch
  enabled: false
  urls: []
- provider: custom_script
  enabled: true
  description: 时事热点聚合脚本
  script_hint: use requests+feedparser to fetch news RSS feeds, cluster by keyword
    similarity, extract hot topics and related article links

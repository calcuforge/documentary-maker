theme:
  primary_color: '#4a90d9'
  background_color: '#f5f7fa'
  text_color: '#1a1a2e'
  accent_color: '#e8724a'
  transition_type: slide
  transition_duration: 16
content:
  tone: casual
voice_design:
  voice_instruct: 女，青年，中音调
  content: 你有没有想过，为什么微波炉加热的食物有时会变得很干？这背后其实有一个有趣的物理原理。
  speed: 1.05
  workflow: ominivoice_voice_design
component_suggestions:
  hero: FullBleedLayout
  overview: IconCard
  question: SplitLayout
  explanation: FlowChart
  demonstration: StepProgress
  comparison: ComparisonCard
  data: DataBar
  quote: QuoteBlock
  summary: StatHighlight
narrative_arc:
- hook
- question
- exploration
- explanation
- examples
- takeaway
- conclusion
research_providers:
- provider: agent_search
  enabled: true
  description: 搜索生活科学原理
  queries:
  - '{topic} 原理'
  - '{topic} 为什么'
  - '{topic} 科学解释'
  - '{topic} 科普'
  - '{topic} how it works'
- provider: web_fetch
  enabled: true
  description: 科普网站、Wikipedia
  urls: []
- provider: rss
  enabled: false
  feeds: []
- provider: custom_script
  enabled: false
visual_composition:
  aigc: low
  stock: medium
  data_charts: medium
  text_components: high
  note: 生活科普以文本解释为主，大量使用文本组件（要点列表、问答、引用），辅以数据图表和少量AI合成示意图
